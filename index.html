    <!-- Analytics: loaded after first paint so it doesn't compete with the app for bandwidth/CPU -->
    <script>
      (function () {
        // Bot gate, two layers.
        //
        // 1. Cheap fingerprint checks for automation that admits to it.
        // 2. Engagement gate: GA only loads once the visitor has interacted
        //    (pointer, key, touch, wheel, scroll) OR kept the tab visible for
        //    4 seconds. The datacenter bots that made up ~75% of Aug 2026
        //    "sessions" (Singapore/China, Direct, 0-2 s, no interaction) pass
        //    the webdriver/UA test but fail this one. Humans who leave inside
        //    4 s without touching anything are lost too, but GA already scored
        //    those as unengaged bounces.
        var ua = navigator.userAgent || '';
        if (
          navigator.webdriver ||
          /HeadlessChrome|bot|crawl|spider|Lighthouse|PhantomJS|Slimer|Electron/i.test(ua) ||
          (!navigator.languages || navigator.languages.length === 0) ||
          (/Chrome\//.test(ua) && !/Edg|OPR|SamsungBrowser/.test(ua) && !window.chrome)
        ) {
          return;
        }

        var loaded = false;
        var timer = null;
        var events = ['pointerdown', 'pointermove', 'keydown', 'touchstart', 'wheel', 'scroll'];

        var cleanup = function () {
          events.forEach(function (e) { window.removeEventListener(e, onEngage, true); });
          document.removeEventListener('visibilitychange', onVisibility);
          if (timer) { clearTimeout(timer); timer = null; }
        };

        var loadAnalytics = function () {
          if (loaded) return;
          loaded = true;
          cleanup();
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PLJMY10S3E';
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', 'G-PLJMY10S3E');
        };

        var onEngage = function () { loadAnalytics(); };

        var armTimer = function () {
          if (timer || loaded) return;
          timer = setTimeout(function () {
            timer = null;
            if (document.visibilityState === 'visible') loadAnalytics();
          }, 4000);
        };
        var onVisibility = function () {
          if (document.visibilityState === 'visible') { armTimer(); }
          else if (timer) { clearTimeout(timer); timer = null; }
        };

        var arm = function () {
          events.forEach(function (e) { window.addEventListener(e, onEngage, { capture: true, passive: true }); });
          document.addEventListener('visibilitychange', onVisibility);
          if (document.visibilityState === 'visible') armTimer();
        };

        if (document.readyState === 'complete') {
          arm();
        } else {
          window.addEventListener('load', arm, { once: true });
        }
      })();
    </script>
